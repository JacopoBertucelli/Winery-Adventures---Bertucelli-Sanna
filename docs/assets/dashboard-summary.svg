  <g><rect x="535" y="204" width="28" height="96" rx="2" fill="#2563eb"/><rect x="577" y="198" width="28" height="102" rx="2" fill="#2563eb"/><rect x="619" y="211" width="28" height="89" rx="2" fill="#2563eb"/><rect x="661" y="195" width="28" height="105" rx="2" fill="#2563eb"/><rect x="703" y="184" width="28" height="116" rx="2" fill="#2563eb"/><rect x="745" y="204" width="28" height="96" rx="2" fill="#2563eb"/><rect x="787" y="207" width="28" height="93" rx="2" fill="#2563eb"/><rect x="829" y="156" width="28" height="144" rx="2" fill="#c2410c"/><rect x="871" y="148" width="28" height="152" rx="2" fill="#dc2626"/></g>
  <line x1="520" y1="164" x2="920" y2="164" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/><text class="tick" x="914" y="158" text-anchor="end">soglia</text>
  <g class="label" text-anchor="middle"><text x="549" y="318">1</text><text x="591" y="318">2</text><text x="633" y="318">3</text><text x="675" y="318">4</text><text x="717" y="318">5</text><text x="759" y="318">6</text><text x="801" y="318">7</text><text x="843" y="318">8</text><text x="885" y="318">9</text></g>
  <g class="value" text-anchor="middle"><text x="549" y="197">7.01</text><text x="591" y="191">7.44</text><text x="633" y="204">6.50</text><text x="675" y="188">7.62</text><text x="717" y="177">8.44</text><text x="759" y="197">6.95</text><text x="801" y="200">6.76</text><text x="843" y="149">10.44</text><text x="885" y="141">11.03</text></g>
  <text class="subtitle" x="40" y="362">Dati generati dal CSV sample della pipeline. La dashboard completa aggiunge temperatura media, anomalie e trend temporali.</text>
</svg>

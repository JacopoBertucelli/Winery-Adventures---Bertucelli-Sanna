<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Sintesi dashboard sui dati sample</title>
  <desc id="desc">Grafici a barre del pH medio e dello stress per le nove cisterne del dataset sample.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #1f2937; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #4b5563; }
    .panel-title { font-size: 16px; font-weight: 650; }
    .axis { stroke: #6b7280; stroke-width: 1; }
    .grid { stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 4 4; }
    .tick { font-size: 11px; fill: #4b5563; }
    .label { font-size: 11px; }
    .value { font-size: 10px; font-weight: 650; }
  </style>
  <rect width="960" height="390" fill="#fffdf9"/>
  <text class="title" x="40" y="38">Dashboard: sintesi dati sample</text>
  <text class="subtitle" x="40" y="60">Stessi indicatori della dashboard HTML: pH medio e stress per cisterna.</text>
  <text class="panel-title" x="40" y="104">pH medio per cisterna</text>
  <text class="tick" x="40" y="126">Scala 3.2–3.8</text>
  <line class="axis" x1="40" y1="300" x2="440" y2="300"/>
  <line class="grid" x1="40" y1="245" x2="440" y2="245"/><line class="grid" x1="40" y1="190" x2="440" y2="190"/><line class="grid" x1="40" y1="135" x2="440" y2="135"/>
  <text class="tick" x="14" y="303">3.2</text><text class="tick" x="14" y="248">3.4</text><text class="tick" x="14" y="193">3.6</text><text class="tick" x="14" y="138">3.8</text>
  <g fill="#0f766e"><rect x="55" y="236" width="28" height="64" rx="2"/><rect x="97" y="231" width="28" height="69" rx="2"/><rect x="139" y="247" width="28" height="53" rx="2"/><rect x="181" y="222" width="28" height="78" rx="2"/><rect x="223" y="173" width="28" height="127" rx="2"/><rect x="265" y="202" width="28" height="98" rx="2"/><rect x="307" y="188" width="28" height="112" rx="2"/><rect x="349" y="209" width="28" height="91" rx="2"/><rect x="391" y="217" width="28" height="83" rx="2"/></g>
  <g class="label" text-anchor="middle"><text x="69" y="318">1</text><text x="111" y="318">2</text><text x="153" y="318">3</text><text x="195" y="318">4</text><text x="237" y="318">5</text><text x="279" y="318">6</text><text x="321" y="318">7</text><text x="363" y="318">8</text><text x="405" y="318">9</text></g>
  <g class="value" text-anchor="middle"><text x="69" y="229">3.43</text><text x="111" y="224">3.45</text><text x="153" y="240">3.39</text><text x="195" y="215">3.49</text><text x="237" y="166">3.66</text><text x="279" y="195">3.56</text><text x="321" y="181">3.61</text><text x="363" y="202">3.53</text><text x="405" y="210">3.51</text></g>
  <text class="panel-title" x="520" y="104">Stress per cisterna</text>
  <text class="tick" x="520" y="126">Arancione e rosso: sopra la soglia di anomalia</text>
  <line class="axis" x1="520" y1="300" x2="920" y2="300"/>
  <line class="grid" x1="520" y1="245" x2="920" y2="245"/><line class="grid" x1="520" y1="190" x2="920" y2="190"/><line class="grid" x1="520" y1="135" x2="920" y2="135"/>
